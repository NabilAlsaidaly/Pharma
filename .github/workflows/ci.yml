name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, xmlwriter, curl, fileinfo, intl, pdo_mysql, redis
          tools: composer:v2
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php84-
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-ansi
      - name: Check platform requirements
        run: composer check-platform-reqs
      - name: Check formatting
        run: vendor/bin/pint --test
      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress
      - name: Run tests
        run: php artisan test
      - name: Security audit
        run: composer audit
